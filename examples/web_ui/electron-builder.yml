appId: com.agentscope.desktop
productName: AgentScope
directories:
    output: dist-electron
    buildResources: build
files:
    - electron-dist/**/*
extraResources:
    - from: ../desktop/main.py
      to: desktop_main.py
mac:
    category: public.app-category.developer-tools
    target:
        - dmg
        - zip
win:
    target:
        - nsis
        - portable
linux:
    target:
        - AppImage
        - deb
    category: Development
